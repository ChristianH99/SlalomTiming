{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Slalom Timing{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <header class="topbar">
    <span class="brand">
      Slalom Timing
      {% if active_competition %}
        <span class="brand-competition">&middot; {{ active_competition.name }}</span>
      {% else %}
        <span class="brand-competition brand-competition--none">&middot; No competition selected</span>
      {% endif %}
    </span>
    <nav>
      <a href="{% url 'timing:dashboard' %}">Dashboard</a>
      <a href="{% url 'competitions:list' %}">Competition Setup</a>
      <a href="{% url 'participants:list' %}">Participants</a>
      <a href="/admin/">Admin</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
