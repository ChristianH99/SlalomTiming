{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Slalom Timing{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div class="shell">
    <aside class="shell-sidebar" id="shell-sidebar">
      <div class="shell-brand">
        <span class="brand">Slalom<span class="brand-slash">/</span>Timing</span>
      </div>
      <nav class="shell-nav">
        <a class="shell-nav-item{% if request.resolver_match.app_name == 'timing' %} active{% endif %}" href="{% url 'timing:dashboard' %}">Dashboard</a>
        <a class="shell-nav-item{% if request.resolver_match.app_name == 'competitions' %} active{% endif %}" href="{% url 'competitions:list' %}">Competition Setup</a>
        <a class="shell-nav-item{% if request.resolver_match.app_name == 'participants' %} active{% endif %}" href="{% url 'participants:list' %}">Participants</a>
      </nav>
      <div class="shell-sidebar-footer">
        <a class="shell-admin-link" href="/admin/">Django Admin</a>
        {% if active_competition %}
          <div class="shell-competition-pill">{{ active_competition.name }}</div>
        {% else %}
          <div class="shell-competition-pill shell-competition-pill--none">No competition selected</div>
        {% endif %}
      </div>
    </aside>
    <div class="shell-overlay" id="shell-overlay"></div>
    <div class="shell-main">
      <div class="shell-topbar">
        <button class="shell-hamburger" id="shell-hamburger" aria-expanded="false" aria-controls="shell-sidebar" aria-label="Toggle navigation">
          <span class="shell-hamburger-icon"><span></span><span></span><span></span></span>
        </button>
      </div>
      <main class="content" id="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script>
    (function () {
      const sidebar = document.getElementById("shell-sidebar");
      const overlay = document.getElementById("shell-overlay");
      const toggle = document.getElementById("shell-hamburger");
      if (!sidebar || !overlay || !toggle) return;

      function close() {
        sidebar.classList.remove("open");
        toggle.setAttribute("aria-expanded", "false");
      }

      toggle.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        toggle.setAttribute("aria-expanded", String(isOpen));
      });
      overlay.addEventListener("click", close);
    })();
  </script>
</body>
</html>
