{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulator – Slalom Timing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="sim-body">
  <header class="sim-topbar">
    <span class="brand">Slalom<span class="brand-slash">/</span>Timing</span>
    <span class="sim-badge">Simulator</span>
  </header>

  <main class="sim">
    <section class="sim-clock-card">
      <div class="sim-clock" id="sim-clock">00:00:00</div>
      <div class="sim-clock-label">Device time</div>
    </section>

    <section class="sim-runnum">
      <div class="sim-runnum-info">
        <span class="sim-runnum-label">Next running number</span>
        <span class="sim-runnum-value" id="sim-runnum">1</span>
      </div>
      <button type="button" class="button button--secondary" id="sim-reset">Reset to 1</button>
    </section>

    <section class="sim-pads">
      <div class="sim-pad-group">
        <span class="sim-pad-label">Light barrier</span>
        <div class="sim-row">
          <button type="button" class="sim-btn sim-btn--barrier" data-port="1" data-manual="0" data-label="1">1</button>
          <button type="button" class="sim-btn sim-btn--barrier" data-port="2" data-manual="0" data-label="2">2</button>
          <button type="button" class="sim-btn sim-btn--barrier" data-port="3" data-manual="0" data-label="3">3</button>
          <button type="button" class="sim-btn sim-btn--barrier" data-port="4" data-manual="0" data-label="4">4</button>
        </div>
      </div>
      <div class="sim-pad-group">
        <span class="sim-pad-label">Manual</span>
        <div class="sim-row">
          <button type="button" class="sim-btn sim-btn--manual" data-port="1" data-manual="1" data-label="M1">M1</button>
          <button type="button" class="sim-btn sim-btn--manual" data-port="2" data-manual="1" data-label="M2">M2</button>
          <button type="button" class="sim-btn sim-btn--manual" data-port="3" data-manual="1" data-label="M3">M3</button>
          <button type="button" class="sim-btn sim-btn--manual" data-port="4" data-manual="1" data-label="M4">M4</button>
        </div>
      </div>
    </section>

    <section class="sim-log-card">
      <div class="sim-log-head">
        <h2>Signal log</h2>
        <button type="button" class="link-button" id="sim-clear">Clear</button>
      </div>
      <ul class="sim-log" id="sim-log" aria-live="polite"></ul>
      <p class="sim-log-empty" id="sim-log-empty">No signals sent yet.</p>
    </section>
  </main>

  <script>
    (function () {
      const SIGNAL_URL = "{% url 'timing:signal' %}";
      const CSRF = "{{ csrf_token }}";

      const pad = (n, len = 2) => String(n).padStart(len, "0");
      const clockStr = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      const fullStr = (d) => `${clockStr(d)}.${pad(d.getMilliseconds(), 3)}`;

      // Running clock (hh:mm:ss). Ticks a few times a second so the second flips
      // promptly; the sub-second precision is captured per signal, not displayed.
      const clockEl = document.getElementById("sim-clock");
      const tick = () => { clockEl.textContent = clockStr(new Date()); };
      tick();
      setInterval(tick, 200);

      // Running number: auto-increments with each signal actually sent, resettable.
      const runnumEl = document.getElementById("sim-runnum");
      let nextNumber = 1;
      const renderRunnum = () => { runnumEl.textContent = nextNumber; };
      document.getElementById("sim-reset").addEventListener("click", () => {
        nextNumber = 1;
        renderRunnum();
      });

      const logEl = document.getElementById("sim-log");
      const logEmptyEl = document.getElementById("sim-log-empty");
      function addLog(text, kind) {
        logEmptyEl.hidden = true;
        const li = document.createElement("li");
        li.className = "sim-log-item" + (kind ? ` sim-log-item--${kind}` : "");
        li.textContent = text;
        logEl.prepend(li);
      }
      document.getElementById("sim-clear").addEventListener("click", () => {
        logEl.replaceChildren();
        logEmptyEl.hidden = false;
      });

      async function sendSignal(button) {
        const now = new Date();
        const time = fullStr(now);
        const port = Number(button.dataset.port);
        const isManual = button.dataset.manual === "1";
        const running = nextNumber;
        const label = button.dataset.label;

        button.classList.add("sim-btn--fired");
        setTimeout(() => button.classList.remove("sim-btn--fired"), 180);

        try {
          const res = await fetch(SIGNAL_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF },
            body: JSON.stringify({ running_number: running, port, is_manual: isManual, time }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || "Signal rejected.");
          addLog(`#${running} · ${label} · ${time}`, isManual ? "manual" : "barrier");
          nextNumber = running + 1;
          renderRunnum();
        } catch (err) {
          addLog(`#${running} · ${label} · ${time} — failed: ${err.message}`, "error");
        }
      }

      document.querySelectorAll(".sim-btn").forEach((button) => {
        button.addEventListener("click", () => sendSignal(button));
      });

      renderRunnum();
    })();
  </script>
</body>
</html>
