{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – Slalom Timing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand">Slalom<span class="brand-slash">/</span>Timing</span>
    </div>
    <h1 class="login-title">Sign in</h1>

    {% if form.errors %}
      <p class="notice notice--error">Wrong username or password. Please try again.</p>
    {% endif %}

    <form method="post" action="{% url 'accounts:login' %}" class="login-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <p>
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
      </p>
      <p>
        <label for="{{ form.password.id_for_label }}">Password</label>
        <span class="pw-wrap">
          {{ form.password }}
          <button type="button" class="pw-reveal" data-pw-reveal
                  aria-label="Show password (hold)" title="Show password (hold)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </span>
      </p>
      <button class="button button--big" type="submit">Sign in</button>
    </form>
  </main>

  <script>
    // Press-and-hold the eye icon to reveal the password; release to hide.
    (function () {
      const btn = document.querySelector("[data-pw-reveal]");
      if (!btn) return;
      const input = btn.closest(".pw-wrap").querySelector("input");
      const show = () => { input.type = "text"; btn.classList.add("pw-reveal--on"); };
      const hide = () => { input.type = "password"; btn.classList.remove("pw-reveal--on"); };
      btn.addEventListener("pointerdown", (e) => { e.preventDefault(); show(); });
      ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => btn.addEventListener(ev, hide));
      // Keyboard: reveal while Space/Enter is held.
      btn.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); show(); } });
      btn.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") hide(); });
      btn.addEventListener("blur", hide);
    })();
  </script>
</body>
</html>
