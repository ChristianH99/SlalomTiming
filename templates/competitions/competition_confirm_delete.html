{% extends "base.html" %}
{% block title %}Delete competition – Slalom Timing{% endblock %}
{% block content %}
  <h1>Delete {{ object.name }}?</h1>
  <p>The competition on {{ object.date }} will be permanently removed.</p>
  <form method="post">
    {% csrf_token %}
    <button class="button" type="submit">Confirm delete</button>
    <a href="{% url 'competitions:list' %}">Cancel</a>
  </form>
{% endblock %}
